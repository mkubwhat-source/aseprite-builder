plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
    archivesName = project.mod_id
}

repositories {
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
        content { includeGroupAndSubgroups 'org.ladysnake' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")

    runs {
        client {
            client()
            configName = 'Fabric Client'
            ideConfigGenerated true
            runDir 'runs/client'
        }
        server {
            server()
            configName = 'Fabric Server'
            ideConfigGenerated true
            runDir 'runs/server'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    include implementation("maven.modrinth:forge-config-api-port:${forgeconfigapiport_version}")
    include implementation("org.ladysnake.cardinal-components-api:cardinal-components-base:${cca_version}")
    include implementation("org.ladysnake.cardinal-components-api:cardinal-components-entity:${cca_version}")
    include implementation("org.ladysnake.cardinal-components-api:cardinal-components-world:${cca_version}")
}

processResources {
    def expandProps = [
        'version'      : project.version,
        'mod_id'       : mod_id,
        'mod_name'     : mod_name,
        'mod_author'   : mod_author,
        'loader_version': loader_version,
        'minecraft_version': minecraft_version,
    ]
    inputs.properties expandProps
    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ['-Xmaxerrs', '100000']
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') { rename { "${it}_${project.mod_id}" } }
}
