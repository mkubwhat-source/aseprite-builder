name: Build DungeonNowLoading (Fabric)

on:
  push:
    branches: [ 'claude/dungeonnowloading-26.3-port-*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Run CI script
        run: bash ci/run.sh
